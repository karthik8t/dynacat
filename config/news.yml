- name: "News"
  columns:
    # ── Full-width head: Breaking / Top Stories ───────────────────────────
    # horizontal-cards shows thumbnails — gives the "card with image" look
    - size: "full"
      widgets:
        - type: "rss"
          title: "🌍 World Headlines"
          style: "horizontal-cards"
          thumbnail-height: 12
          limit: 12
          collapse-after: -1
          feeds:
            - url: "https://feeds.bbci.co.uk/news/world/rss.xml"
              title: "BBC World"
            - url: "https://www.aljazeera.com/xml/rss/all.xml"
              title: "Al Jazeera"
            - url: "https://feeds.reuters.com/reuters/worldNews"
              title: "Reuters"
            - url: "https://www.theguardian.com/world/rss"
              title: "The Guardian"

        - type: "rss"
          title: "🇮🇳 India — Top Stories"
          style: "horizontal-cards"
          thumbnail-height: 12
          limit: 12
          collapse-after: -1
          feeds:
            - url: "https://www.thehindu.com/news/national/feeder/default.rss"
              title: "The Hindu"
            - url: "https://feeds.feedburner.com/ndtvnews-india-news"
              title: "NDTV"
            - url: "https://timesofindia.indiatimes.com/rssfeeds/296589292.cms"
              title: "Times of India"
            - url: "https://www.reddit.com/r/india.rss"
              title: "r/india"

        - type: "rss"
          title: "�️ Telangana & Hyderabad"
          style: "horizontal-cards"
          thumbnail-height: 12
          limit: 10
          collapse-after: -1
          feeds:
            - url: "https://telanganatoday.com/feed"
              title: "Telangana Today"
            - url: "https://www.sakshipost.com/rss/latest_today.xml"
              title: "Sakshi Post"
            - url: "https://www.thehindu.com/news/cities/Hyderabad/feeder/default.rss"
              title: "The Hindu · Hyderabad"
            - url: "https://timesofindia.indiatimes.com/rssfeeds/7098551.cms"
              title: "TOI · Hyderabad"

        - type: "group"
          title: "📰 More News"
          widgets:
            - type: "rss"
              title: "Science & Technology"
              style: "horizontal-cards"
              thumbnail-height: 12
              limit: 10
              collapse-after: -1
              feeds:
                - url: "https://feeds.bbci.co.uk/news/technology/rss.xml"
                  title: "BBC Tech"
                - url: "https://www.theguardian.com/technology/rss"
                  title: "Guardian Tech"
                - url: "https://www.sciencedaily.com/rss/top/science.xml"
                  title: "Science Daily"
                - url: "https://www.reddit.com/r/technology.rss"
                  title: "r/technology"

            - type: "rss"
              title: "Business & Economy"
              style: "horizontal-cards"
              thumbnail-height: 12
              limit: 10
              collapse-after: -1
              feeds:
                - url: "https://www.thehindu.com/business/feeder/default.rss"
                  title: "The Hindu · Business"
                - url: "https://feeds.feedburner.com/ndtvnews-business"
                  title: "NDTV Business"
                - url: "https://feeds.reuters.com/reuters/businessNews"
                  title: "Reuters Business"
                - url: "https://www.reddit.com/r/economy.rss"
                  title: "r/economy"

            - type: "rss"
              title: "Health & Environment"
              style: "horizontal-cards"
              thumbnail-height: 12
              limit: 10
              collapse-after: -1
              feeds:
                - url: "https://feeds.bbci.co.uk/news/health/rss.xml"
                  title: "BBC Health"
                - url: "https://www.theguardian.com/environment/rss"
                  title: "Guardian Environment"
                - url: "https://www.reddit.com/r/health.rss"
                  title: "r/Health"
