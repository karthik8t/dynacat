- name: "Dev & Tech"
  columns:
    # ── Left: bookmarks + releases — utility sidebar ──────────────────────
    - size: "small"
      widgets:
        - type: "bookmarks"
          title: "Quick Links"
          groups:
            - title: "Dev & AI Platforms"
              color: "200 60 55"
              links:
                - title: "GitHub"
                  url: "https://github.com"
                  icon: "si:github"
                - title: "Hugging Face"
                  url: "https://huggingface.co"
                  icon: "si:huggingface"
                - title: "ChatGPT"
                  url: "https://chatgpt.com"
                  icon: "si:openai"
                - title: "Perplexity"
                  url: "https://www.perplexity.ai"
                  icon: "si:perplexity"
                - title: "Ollama"
                  url: "https://ollama.com"
                  icon: "si:ollama"

            - title: "Tools & Docs"
              color: "160 50 50"
              links:
                - title: "MDN Web Docs"
                  url: "https://developer.mozilla.org"
                  icon: "si:mdnwebdocs"
                - title: "DevDocs"
                  url: "https://devdocs.io"
                  icon: "mdi:book-open-outline"
                - title: "Stack Overflow"
                  url: "https://stackoverflow.com"
                  icon: "si:stackoverflow"
                - title: "Regex101"
                  url: "https://regex101.com"
                  icon: "mdi:regex"
                - title: "JSON Formatter"
                  url: "https://jsonformatter.curiousconcept.com"
                  icon: "mdi:code-json"

            - title: "Self-Hosted"
              color: "270 50 60"
              links:
                - title: "Awesome Selfhosted"
                  url: "https://awesome-selfhosted.net"
                  icon: "mdi:star-outline"
                - title: "selfh.st"
                  url: "https://selfh.st"
                  icon: "mdi:server"
                - title: "LinuxServer.io"
                  url: "https://www.linuxserver.io"
                  icon: "si:linuxserver"
                - title: "GitHub Trending"
                  url: "https://github.com/trending"
                  icon: "si:github"

        - type: "releases"
          title: "Latest Releases"
          cache: 6h
          collapse-after: 6
          show-source-icon: true
          repositories:
            - glanceapp/glance
            - ollama/ollama
            - immich-app/immich
            - go-gitea/gitea
            - dani-garcia/vaultwarden
            - AdguardTeam/AdGuardHome

    # ── Center: Videos + HN + Lobsters ───────────────────────────────────
    - size: "full"
      widgets:
        - type: "videos"
          title: "Tech Creators"
          style: "grid-cards"
          collapse-after-rows: 2
          channels:
            - "UCsBjURrPoezykLs9EqgamOA" # Fireship
            - "UC29ju8bIPH5as8OGnQzwJyA" # Traversy Media
            - "UCR-DXc1voovS8nhAvccRZhg" # Jeff Geerling
            - "UCVls1GmFKf6WlTraIb_IaJg" # DistroTube
            - "UCHnyfMqiRRG1u-2MsSQLbXA" # Veritasium
            - "UCWX3yGbODk2pMOaFnFMKiKg" # NetworkChuck
            - "UC7YOGHUfC1Tb2alpyB9-SGQ" # Theo - t3.gg
            - "UCVYamHliCI9rw1tHR1xbkfw" # Dave2D
            - "UCBJycsmduvYEL83R_U4JriQ" # MKBHD
            - "UCG7J20LhUeLl6y_Emi7OJrA" # MKBHD - The Studio
            - "UC2J-0g_nxlwcD9JBK1eTleQ" # MKBHD - Auto Focus
            - "UCXuqSBlHAE6Xw-yeJA0Tunw" # Linus Tech Tips
            - "UC0vBXGSyV14uvJ4hECDOl0Q" # Techquickie
            - "UCeeFfhMcJa1kjtfZAGskOCA" # TechLinked
            - "UCdBK94H6oZT2Q7l0-b0xmMg" # ShortCircuit

        - type: "split-column"
          widgets:
            - type: "hacker-news"
              title: "Hacker News"
              limit: 15
              collapse-after: 8
              sort-by: "top"
              extra-sort-by: "engagement"

            - type: "lobsters"
              title: "Lobsters"
              limit: 15
              collapse-after: 8
              sort-by: "hot"

    # ── Right: Dev news — detailed read ───────────────────────────────────
    - size: "small"
      widgets:
        - type: "rss"
          title: "Tech News"
          style: "detailed-list"
          limit: 10
          collapse-after: 6
          feeds:
            - url: "https://thenewstack.io/feed/"
              title: "The New Stack"
            - url: "https://www.wired.com/feed/rss"
              title: "Wired"
            - url: "https://feeds.arstechnica.com/arstechnica/index"
              title: "Ars Technica"
            - url: "https://www.theverge.com/rss/index.xml"
              title: "The Verge"

        - type: "rss"
          title: "Dev Blogs"
          style: "vertical-list"
          single-line-titles: true
          limit: 12
          collapse-after: -1
          feeds:
            - url: "https://dev.to/feed"
              title: "DEV Community"
            - url: "https://blog.github.com/all.atom"
              title: "GitHub Blog"
            - url: "https://changelog.com/news.rss"
              title: "Changelog"
            - url: "https://news.ycombinator.com/rss"
              title: "Hacker News"
