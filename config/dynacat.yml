server:
  assets-path: /app/assets

theme:
  background-color: 240 8 9
  primary-color: 43 50 70
  positive-color: 96 44 68
  negative-color: 0 70 70
  contrast-multiplier: 1.1
  custom-css-file: /assets/user.css
  disable-picker: false
  presets:
    gruvbox-dark:
      background-color: 0 0 16
      primary-color: 43 59 81
      positive-color: 61 66 44
      negative-color: 6 96 59

branding:
  app-name: "MyDash"
  logo-text: "M"
  hide-footer: false
  custom-footer: |
    <p style="opacity:0.4">MyDash · Powered by <a href="https://github.com/glanceapp/glance">Glance</a></p>

pages:
  - $include: home.yml
  - $include: dev-tech.yml
  - $include: open-source.yml
  - $include: dev-learning.yml
  - $include: news.yml
  - $include: news-sports-games.yml
  - $include: news-entertainment.yml
  - $include: news-politics-world.yml
  - $include: markets.yml
