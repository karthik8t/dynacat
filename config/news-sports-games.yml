- name: "Sports & Games"
  columns:
    # ── Left: Cricket hero + compact India sports list ────────────────────
    - size: "full"
      widgets:
        - type: "rss"
          title: "🏏 Cricket"
          style: "horizontal-cards"
          thumbnail-height: 15
          limit: 10
          collapse-after: -1
          feeds:
            - url: "https://www.espncricinfo.com/rss/content/story/feeds/0.xml"
              title: "ESPN Cricinfo"
            - url: "https://feeds.bbci.co.uk/sport/cricket/rss.xml"
              title: "BBC Cricket"
            - url: "https://timesofindia.indiatimes.com/rssfeeds/4719161.cms"
              title: "TOI Cricket"

        - type: "split-column"
          widgets:
            - type: "rss"
              title: "⚽ Football"
              style: "detailed-list"
              limit: 8
              collapse-after: 5
              feeds:
                - url: "https://feeds.bbci.co.uk/sport/football/rss.xml"
                  title: "BBC Football"
                - url: "https://www.theguardian.com/football/rss"
                  title: "Guardian Football"
                - url: "https://timesofindia.indiatimes.com/rssfeeds/4719148.cms"
                  title: "TOI Sports"

            - type: "rss"
              title: "🏎️ Formula 1"
              style: "detailed-list"
              limit: 8
              collapse-after: 5
              feeds:
                - url: "https://www.autosport.com/rss/feed/f1"
                  title: "Autosport F1"
                - url: "https://feeds.bbci.co.uk/sport/formula1/rss.xml"
                  title: "BBC F1"
                - url: "https://www.motorsport.com/rss/f1/news/"
                  title: "Motorsport.com F1"

        - type: "rss"
          title: "🌐 World Sport"
          style: "horizontal-cards-2"
          card-height: 24
          limit: 8
          collapse-after: -1
          feeds:
            - url: "https://feeds.bbci.co.uk/sport/rss.xml"
              title: "BBC Sport"
            - url: "https://www.espn.com/espn/rss/news"
              title: "ESPN"
            - url: "https://www.skysports.com/rss/12040"
              title: "Sky Sports"

    # ── Right: Gaming — detailed with sidebar feel ────────────────────────
    - size: "small"
      widgets:
        - type: "rss"
          title: "🎮 Gaming Headlines"
          style: "detailed-list"
          limit: 10
          collapse-after: 6
          feeds:
            - url: "https://www.ign.com/articles.rss"
              title: "IGN"
            - url: "https://www.gamespot.com/feeds/mashup/"
              title: "GameSpot"
            - url: "https://www.eurogamer.net/feed"
              title: "Eurogamer"

        - type: "rss"
          title: "🕹️ PC & Indie"
          style: "vertical-list"
          single-line-titles: true
          limit: 12
          collapse-after: 7
          feeds:
            - url: "https://www.rockpapershotgun.com/feed"
              title: "Rock Paper Shotgun"
            - url: "https://www.pcgamer.com/rss/"
              title: "PC Gamer"

        - type: "rss"
          title: "📱 Mobile Gaming"
          style: "vertical-list"
          single-line-titles: true
          limit: 8
          collapse-after: 5
          feeds:
            - url: "https://toucharcade.com/feed/"
              title: "TouchArcade"
            - url: "https://www.pocketgamer.com/rss/"
              title: "Pocket Gamer"
