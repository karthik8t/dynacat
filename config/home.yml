- name: "Home"
  columns:
    - size: "full"
      widgets:
        - type: "search"
          autofocus: true
          search-engine: google
          new-tab: true
          placeholder: "Search the web..."
          bangs:
            - title: "YouTube"
              shortcut: "!yt"
              url: "https://www.youtube.com/results?search_query={QUERY}"
            - title: "GitHub"
              shortcut: "!gh"
              url: "https://github.com/search?q={QUERY}"
            - title: "Reddit"
              shortcut: "!r"
              url: "https://www.reddit.com/search/?q={QUERY}"
            - title: "DuckDuckGo"
              shortcut: "!d"
              url: "https://duckduckgo.com/?q={QUERY}"

        # ----------------------------------------------------------------
        # Docker Containers widget
        #
        # This widget reads from the Docker socket and shows all running
        # containers automatically — no config changes needed when you
        # add or remove services.
        #
        # To make a container show up with a clickable URL + icon, add
        # these labels to it in its own docker-compose.yml:
        #
        #   labels:
        #     glance.name: "Jellyfin"
        #     glance.icon: "si:jellyfin"
        #     glance.url: "http://<your-host-ip>:8096"
        #     glance.description: "Media server"
        #
        # Containers without labels will still appear (name auto-formatted),
        # just without an icon or clickable link.
        # ----------------------------------------------------------------
        - type: "docker-containers"
          title: "Running Services"
          collapse-after: 12
          hide-by-default: false
          format-container-names: true

        - type: "monitor"
          title: "Service Health"
          cache: 1m
          # Add your service URLs here — these are checked every minute
          # and show up/down status with a direct link to each service.
          sites:
            - title: "Portainer"
              url: "http://localhost:9000"
              icon: "si:portainer"
            - title: "Jellyfin"
              url: "http://localhost:8096"
              icon: "si:jellyfin"
            - title: "Gitea"
              url: "http://localhost:3000"
              icon: "si:gitea"
            - title: "Vaultwarden"
              url: "http://localhost:8181"
              icon: "si:vaultwarden"
            - title: "AdGuard Home"
              url: "http://localhost:3001"
              icon: "si:adguard"
            - title: "Nextcloud"
              url: "http://localhost:8888"
              icon: "si:nextcloud"
